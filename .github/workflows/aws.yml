name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 开始部署通知 → 飞书 bot(蓝卡)──
      - name: Notify Lark (start)
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          ACTOR:        ${{ github.actor }}
          SHA:          ${{ github.sha }}
          COMMIT_MSG:   ${{ github.event.head_commit.message }}
          REF_NAME:     ${{ github.ref_name }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ -z "$LARK_WEBHOOK" ]; then echo "LARK_WEBHOOK 未配置,跳过通知"; exit 0; fi
          TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
          MSG_LINE="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          payload="$(jq -n \
            --arg branch "$REF_NAME" --arg actor "$ACTOR" --arg sha "$SHORT_SHA" \
            --arg msg "$MSG_LINE" --arg time "$TIME" --arg url "$RUN_URL" \
            '{msg_type:"interactive",card:{config:{wide_screen_mode:true},
              header:{title:{tag:"plain_text",content:"🚀 开始部署 · rocky.interface"},template:"blue"},
              elements:[
                {tag:"div",fields:[
                  {is_short:true,text:{tag:"lark_md",content:("**项目**\nrocky.interface")}},
                  {is_short:true,text:{tag:"lark_md",content:("**分支**\n"+$branch)}},
                  {is_short:true,text:{tag:"lark_md",content:("**状态**\n构建中…")}},
                  {is_short:true,text:{tag:"lark_md",content:("**触发人**\n"+$actor)}},
                  {is_short:true,text:{tag:"lark_md",content:("**提交**\n"+$sha+" "+$msg)}},
                  {is_short:true,text:{tag:"lark_md",content:("**开始时间**\n"+$time+" (UTC+8)")}}
                ]},
                {tag:"hr"},
                {tag:"action",actions:[{tag:"button",
                  text:{tag:"plain_text",content:"查看运行日志"},url:$url,type:"default"}]}
              ]}}')"
          code=$(curl -s -o /tmp/lark_resp -w '%{http_code}' -X POST "$LARK_WEBHOOK" \
            -H 'Content-Type: application/json' -d "$payload")
          echo "Lark HTTP $code: $(cat /tmp/lark_resp)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash ~/inter.sh

      # ── 构建/部署报警 → 飞书 bot(成功、失败都发)──
      - name: Notify Lark (result)
        if: always()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          JOB_STATUS:   ${{ job.status }}
          ACTOR:        ${{ github.actor }}
          SHA:          ${{ github.sha }}
          COMMIT_MSG:   ${{ github.event.head_commit.message }}
          REF_NAME:     ${{ github.ref_name }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ -z "$LARK_WEBHOOK" ]; then echo "LARK_WEBHOOK 未配置,跳过通知"; exit 0; fi
          TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
          MSG_LINE="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ 部署成功 · rocky.interface"; COLOR="green"; STATUS_TXT="SUCCESS"
          else
            TITLE="❌ 部署失败 · rocky.interface"; COLOR="red"
            STATUS_TXT="$(printf '%s' "$JOB_STATUS" | tr '[:lower:]' '[:upper:]')"
          fi
          payload="$(jq -n \
            --arg title "$TITLE" --arg color "$COLOR" \
            --arg branch "$REF_NAME" --arg status "$STATUS_TXT" \
            --arg actor "$ACTOR" --arg sha "$SHORT_SHA" --arg msg "$MSG_LINE" \
            --arg time "$TIME" --arg url "$RUN_URL" \
            '{msg_type:"interactive",card:{config:{wide_screen_mode:true},
              header:{title:{tag:"plain_text",content:$title},template:$color},
              elements:[
                {tag:"div",fields:[
                  {is_short:true,text:{tag:"lark_md",content:("**项目**\nrocky.interface")}},
                  {is_short:true,text:{tag:"lark_md",content:("**分支**\n"+$branch)}},
                  {is_short:true,text:{tag:"lark_md",content:("**状态**\n"+$status)}},
                  {is_short:true,text:{tag:"lark_md",content:("**触发人**\n"+$actor)}},
                  {is_short:true,text:{tag:"lark_md",content:("**提交**\n"+$sha+" "+$msg)}},
                  {is_short:true,text:{tag:"lark_md",content:("**完成时间**\n"+$time+" (UTC+8)")}}
                ]},
                {tag:"hr"},
                {tag:"action",actions:[{tag:"button",
                  text:{tag:"plain_text",content:"查看运行日志"},url:$url,type:"primary"}]}
              ]}}')"
          code=$(curl -s -o /tmp/lark_resp -w '%{http_code}' -X POST "$LARK_WEBHOOK" \
            -H 'Content-Type: application/json' -d "$payload")
          echo "Lark HTTP $code: $(cat /tmp/lark_resp)"
